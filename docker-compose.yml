version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_dev
    environment:
      SA_PASSWORD: "PassGrupo1!"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"      # Mapea puerto del contenedor al host
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S 127.0.0.1 -U sa -P PassGrupo1! -Q 'SELECT 1'"]
      interval: 10s
      retries: 10
      start_period: 20s
